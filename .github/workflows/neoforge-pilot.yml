name: NeoForge 26.3 pilot environment

on:
  workflow_dispatch:
  push:
    paths:
      - 'platforms/neoforge-26.3/**'
      - '.github/workflows/neoforge-pilot.yml'
  pull_request:
    paths:
      - 'platforms/neoforge-26.3/**'
      - '.github/workflows/neoforge-pilot.yml'

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: Prepare the real NeoForge environment
        shell: bash
        run: |
          mkdir -p build/neoforge-pilot
          chmod +x ./gradlew
          ./gradlew -p platforms/neoforge-26.3 preparePilot --console=plain --max-workers=1 --no-daemon 2>&1 | tee build/neoforge-pilot/prepare.log
      - name: Upload preparation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: neoforge-26.3-pilot-environment
          path: |
            build/neoforge-pilot/prepare.log
            platforms/neoforge-26.3/build/pilot-environment.txt
          if-no-files-found: error
