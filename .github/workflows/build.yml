name: build
on: [pull_request, push]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: Make wrapper executable
        run: chmod +x ./gradlew
      - name: Build all exact-version artifacts and validation classpaths
        run: ./gradlew build writeValidationConfig --console=plain --max-workers=2
      - name: Check client/server injections and regression data on every node
        run: python3 tools/verify_matrix.py --checks --workers 2
      - name: Audit release metadata, refmaps and no-render variants
        run: python3 tools/verify_artifacts.py
      - name: Upload deliverables and validation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Biblioteca
          path: |
            build/distributions/*.jar
            build/validation/results.json
            build/validation/artifacts.json
            build/validation/**/loader.log
            build/validation/**/checks-compile.log
          if-no-files-found: error
